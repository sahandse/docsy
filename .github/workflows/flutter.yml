name: Flutter CI

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --org com.sahandse --project-name docsy .
      - name: Allow external file handoff on Android 11+
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          queries = (
              '    <queries>\n'
              '        <intent>\n'
              '            <action android:name="android.intent.action.VIEW" />\n'
              '            <data android:mimeType="*/*" />\n'
              '        </intent>\n'
              '    </queries>\n'
          )
          if "<queries>" not in text:
              text = text.replace("<application", queries + "    <application", 1)
              manifest.write_text(text)
              print("Added package visibility queries for open_filex.")
          PY
      - name: Set Android app compile SDK
        run: sed -i -E 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
      - name: Install dependencies
        run: flutter pub get
      - name: Generate custom Android launcher icon
        run: |
          mkdir -p assets
          base64 --decode tooling/docsy_icon.png.base64 > assets/docsy_icon.png
          dart run flutter_launcher_icons
      - name: Set Android plugin compile SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          pattern = re.compile(
              r"^([ \\t]*compileSdk(?:Version)?[ \\t]*(?:=[ \\t]*)?)"
              r"(?:flutter\\.compileSdkVersion|[0-9]+)"
              r"([ \\t]*(?://.*)?[ \\t]*)$",
              re.MULTILINE,
          )
          changed = []
          for path in root.glob("*/android/build.gradle*"):
              original = path.read_text()
              updated = pattern.sub(lambda match: f"{match.group(1)}36{match.group(2)}", original)
              if updated != original:
                  path.write_text(updated)
                  changed.append(str(path))
          print(f"Updated compileSdk to 36 in {len(changed)} Android plugin Gradle files.")
          for path in changed:
              print(f" - {path}")
          PY
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: docsy-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
