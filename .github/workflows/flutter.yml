name: Flutter CI

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --org com.sahandse --project-name docsy .
      - name: Set Android app compile SDK
        run: sed -i -E 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
      - name: Install dependencies
        run: flutter pub get
      - name: Set Android plugin compile SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          pattern = re.compile(
              r"^([ \\t]*compileSdk(?:Version)?[ \\t]*(?:=[ \\t]*)?)"
              r"(?:flutter\\.compileSdkVersion|[0-9]+)"
              r"([ \\t]*(?://.*)?[ \\t]*)$",
              re.MULTILINE,
          )
          changed = []
          for path in root.glob("*/android/build.gradle*"):
              original = path.read_text()
              updated = pattern.sub(r"\\g<1>36\\g<2>", original)
              if updated != original:
                  path.write_text(updated)
                  changed.append(str(path))
          print(f"Updated compileSdk to 36 in {len(changed)} Android plugin Gradle files.")
          for path in changed:
              print(f" - {path}")
          PY
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: docsy-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
