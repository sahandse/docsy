name: docsy
description: A minimal, bilingual document viewer for Android built with Flutter.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^8.1.7
  open_filex: ^4.6.0
  shared_preferences: ^2.3.5
  path: ^1.9.0
  pdfrx: ^2.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
